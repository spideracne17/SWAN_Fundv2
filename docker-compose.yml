version: '3.8'

services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: swan-fund
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./pocketbase/pb_data:/pb_data
      - ./dist:/pb_public
    environment:
      - PB_ENCRYPTION_KEY=
    command: ["serve", "--http=0.0.0.0:8090", "--publicDir=/pb_public"]
